<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:0.95" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="50" fill="white" opacity="0.1"/>
  <circle cx="1100" cy="530" r="80" fill="white" opacity="0.1"/>
  <rect x="50" y="400" width="100" height="100" fill="white" opacity="0.05" transform="rotate(45 100 450)"/>
  
  <!-- Main Content Card -->
  <rect x="80" y="80" width="1040" height="470" rx="20" fill="url(#cardGradient)" stroke="white" stroke-width="2" opacity="0.95"/>
  
  <!-- Title -->
  <text x="600" y="150" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="48" font-weight="bold">
    <tspan x="600" dy="0">2024 Stock Market Titans</tspan>
    <tspan x="600" dy="60">NVIDIA • Tesla • Apple</tspan>
  </text>
  
  <!-- Company Logos/Icons -->
  <!-- NVIDIA Icon -->
  <g transform="translate(200, 280)">
    <rect x="0" y="0" width="80" height="80" rx="10" fill="#76b900"/>
    <text x="40" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">N</text>
    <text x="40" y="110" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="16" font-weight="600">NVIDIA</text>
    <text x="40" y="130" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="12">AI Leader</text>
  </g>
  
  <!-- Tesla Icon -->
  <g transform="translate(460, 280)">
    <rect x="0" y="0" width="80" height="80" rx="10" fill="#e31e24"/>
    <text x="40" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">T</text>
    <text x="40" y="110" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="16" font-weight="600">TESLA</text>
    <text x="40" y="130" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Robotaxi</text>
  </g>
  
  <!-- Apple Icon -->
  <g transform="translate(720, 280)">
    <rect x="0" y="0" width="80" height="80" rx="10" fill="#007aff"/>
    <text x="40" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">A</text>
    <text x="40" y="110" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="16" font-weight="600">APPLE</text>
    <text x="40" y="130" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Resilience</text>
  </g>
  
  <!-- Stock Chart Visualization -->
  <g transform="translate(850, 280)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Chart Lines -->
    <polyline points="10,60 30,45 50,30 70,25 90,20 110,15" fill="none" stroke="#10b981" stroke-width="3"/>
    <polyline points="10,65 30,55 50,50 70,45 90,40 110,35" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <polyline points="10,70 30,65 50,60 70,58 90,55 110,52" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <text x="60" y="100" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="12" font-weight="600">Market Trends</text>
  </g>
  
  <!-- Subtitle -->
  <text x="600" y="420" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="24" font-weight="500">
    Investment Analysis & Market Insights
  </text>
  
  <!-- Date and Author -->
  <text x="600" y="460" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="16">
    December 15, 2024 • By David Chen • FinVision
  </text>
  
  <!-- Trending Badge -->
  <g transform="translate(950, 100)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#10b981"/>
    <text x="60" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="600">📈 TRENDING</text>
  </g>
  
  <!-- FinVision Logo/Brand -->
  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#3b82f6"/>
    <text x="20" y="28" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">F</text>
    <text x="50" y="25" fill="#1e293b" font-family="Arial, sans-serif" font-size="18" font-weight="bold">FinVision</text>
  </g>
</svg>
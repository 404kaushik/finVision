<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f8f9fa" />
  <g transform="translate(400, 300)">
    <!-- Brain graphic -->
    <path d="M-100,-50 C-80,-90 -40,-100 0,-100 C40,-100 80,-90 100,-50 C120,-10 120,30 100,70 C80,110 40,120 0,120 C-40,120 -80,110 -100,70 C-120,30 -120,-10 -100,-50 Z" fill="#e6f7ff" stroke="#0070f3" stroke-width="3" />
    
    <!-- Circuit patterns -->
    <path d="M-80,-60 L-40,-60 L-40,-20 L0,-20 L0,20 L40,20 L40,60 L80,60" fill="none" stroke="#0070f3" stroke-width="2" />
    <path d="M-60,-80 L-60,-40 L-20,-40 L-20,0 L20,0 L20,40 L60,40 L60,80" fill="none" stroke="#0070f3" stroke-width="2" />
    
    <!-- Nodes -->
    <circle cx="-80" cy="-60" r="5" fill="#0070f3" />
    <circle cx="-40" cy="-60" r="5" fill="#0070f3" />
    <circle cx="-40" cy="-20" r="5" fill="#0070f3" />
    <circle cx="0" cy="-20" r="5" fill="#0070f3" />
    <circle cx="0" cy="20" r="5" fill="#0070f3" />
    <circle cx="40" cy="20" r="5" fill="#0070f3" />
    <circle cx="40" cy="60" r="5" fill="#0070f3" />
    <circle cx="80" cy="60" r="5" fill="#0070f3" />
    
    <circle cx="-60" cy="-80" r="5" fill="#0070f3" />
    <circle cx="-60" cy="-40" r="5" fill="#0070f3" />
    <circle cx="-20" cy="-40" r="5" fill="#0070f3" />
    <circle cx="-20" cy="0" r="5" fill="#0070f3" />
    <circle cx="20" cy="0" r="5" fill="#0070f3" />
    <circle cx="20" cy="40" r="5" fill="#0070f3" />
    <circle cx="60" cy="40" r="5" fill="#0070f3" />
    <circle cx="60" cy="80" r="5" fill="#0070f3" />
    
    <!-- Stock chart overlay -->
    <path d="M-100,50 L-70,30 L-40,40 L-10,20 L20,25 L50,0 L80,-30 L110,-50" fill="none" stroke="#10b981" stroke-width="4" />
    <path d="M-100,50 L110,-50" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="5,5" />
  </g>
</svg>